name: Сборка

# Проверочная сборка на каждый PR в master И в release/* — по новой схеме
# ветвления feat/fix/docs вливаются в релизную ветку не напрямую, а PR-ом,
# и та же проверка нужна на этом шаге, а не только на финальном PR в master.
# Если экспорт сломан, это видно до вливания, а ревьюер может скачать готовую
# сборку из артефактов прогона.
# Пробную сборку с произвольной ветки/коммита даёт workflow_dispatch — кнопка
# «Run workflow» в Actions позволяет выбрать любую ветку, тег или SHA.
# Релиз собирается отдельным workflow (release.yml) и только после мёржа в master.
on:
  pull_request:
    branches: [master, "release/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows и Linux
    runs-on: ubuntu-latest
    # Холодный импорт ассетов занимает минуты; если прогон упёрся сильно дольше,
    # это поломка, а не медленный раннер — не жечь часы впустую.
    timeout-minutes: 45

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      # Рантайм byProd качается прямо с byprod.io на каждой сборке — это
      # официальная раздача SDK самим правообладателем, а не хранение копии:
      # между прогонами нигде ничего не остаётся, что и требует лицензия
      # (пункт 2, запрет выкладывать библиотеку «саму по себе»).
      #
      # Голый curl на этот URL отдаёт HTML-заглушку с редиректом вместо архива —
      # это не защита от ботов, а обычная nginx-настройка против прямого
      # скрапинга поисковиками; браузерный Referer её снимает (см. -e ниже).
      #
      # Версия зафиксирована в самом URL, а sha256 — отдельно: если Madrigal
      # обновит контент по тому же имени файла, шаг явно упадёт на сверке
      # суммы, а не подсунет молча другую версию библиотеки.
      #
      # Шаг обязателен: byprod.gdextension объявляет библиотеку зависимостью, а
      # Godot обрывает экспорт, если объявленной зависимости нет на диске.
      - name: Скачать рантайм byProd
        shell: bash
        env:
          BYPROD_SDK_URL: https://byprod.io/packages/byProdSDK0.5.2.zip
          BYPROD_SDK_SHA256: 00ab7d4616e7bec209c51a5ce302bd6a839f0dbea35146cdbe44b41c93e40766
        run: |
          set -euo pipefail
          curl -fsSL "$BYPROD_SDK_URL" -e "https://byprod.io/" -o /tmp/byprod-sdk.zip
          echo "${BYPROD_SDK_SHA256}  /tmp/byprod-sdk.zip" | sha256sum -c -
          unzip -jo /tmp/byprod-sdk.zip "*/bin/byProd.dll" "*/bin/libbyProd.so" -d addons/byprod/bin/
          rm /tmp/byprod-sdk.zip
          ls -l addons/byprod/bin/

      - name: Определить метку сборки
        id: label
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            label="pr${PR_NUMBER}"
          else
            # Метка уходит в имя файла, а имя ветки может содержать слеш
            # (release/v0.5.0) — иначе архив уехал бы в подкаталог.
            label="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      # Обе платформы на одном раннере: движок, шаблоны и импорт ресурсов
      # переиспользуются, второй вызов доходит до экспорта за секунды.
      - name: Собрать Windows
        uses: ./.github/actions/godot-export
        with:
          platform: windows
          label: ${{ steps.label.outputs.label }}

      - name: Собрать Linux
        uses: ./.github/actions/godot-export
        with:
          platform: linux
          label: ${{ steps.label.outputs.label }}

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: astral-genesis-${{ steps.label.outputs.label }}
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
