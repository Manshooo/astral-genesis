name: Сборка

# Проверки и проверочная сборка на каждый PR в master и на каждый пуш в master.
# Релизных веток нет: все PR идут прямо в master (docs/astral-genesis/Задачи/
# Карточки/Работа в master и релизы тегами.md), поэтому точка проверки одна.
# По PR сломанный экспорт видно до вливания, а ревьюер скачивает готовую сборку
# из артефактов прогона. По пушу в master своя сборка есть у каждого коммита, и
# номер в ней (0.7.0-dev.33+fc91d3c — в углу главного меню и в имени архива)
# говорит, из какого она коммита: снапшотов -devN у проекта нет.
# Пробную сборку с произвольной ветки/коммита даёт workflow_dispatch — кнопка
# «Run workflow» в Actions позволяет выбрать любую ветку, тег или SHA.
# Релиз собирается отдельным workflow (release.yml) — по кнопке, не по мёржу.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Новый пуш в PR делает прошлую сборку PR ненужной, а новый коммит master
  # прошлую сборку master — нет: у каждого коммита она своя, и отменённая
  # оставила бы коммит без сборки.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Headless-проверки из dev/ — те же, что разработчик гоняет перед PR
  # (dev/run_checks.ps1). Раньше CI их не запускал вовсе: PR, ломающий
  # генератор, вселение или двери, проходил зелёным, пока держался экспорт, и
  # проверки оставались ритуалом, которого ничто не требовало. Отдельным джобом,
  # а не шагом сборки: падение проверок видно сразу, не дожидаясь экспорта, а
  # шаблоны экспорта (почти гигабайт) проверкам не нужны.
  checks:
    name: Headless-проверки
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      # Рантайм byProd здесь не качается намеренно: его отсутствие обязано
      # значить «нет звука», а не «не запускается», и byprod_check сверяет
      # именно это поведение (docs/astral-genesis/how-to/Звук.md).
      - name: Движок и импорт
        id: godot
        uses: ./.github/actions/godot-setup
        with:
          templates: "false"

      - name: Прогнать проверки
        shell: pwsh
        env:
          GODOT: ${{ steps.godot.outputs.bin }}
        run: ./dev/run_checks.ps1 -SkipSubmoduleCheck

  build:
    name: Windows и Linux
    runs-on: ubuntu-latest
    # Холодный импорт ассетов занимает минуты; если прогон упёрся сильно дольше,
    # это поломка, а не медленный раннер — не жечь часы впустую.
    timeout-minutes: 45

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v7
        with:
          # Вся история с тегами: номер сборки считает git describe от
          # последнего vX.Y.Z, а в клоне глубины 1 тега нет.
          fetch-depth: 0
          lfs: true
          submodules: recursive

      # Рантайм byProd качается прямо с byprod.io на каждой сборке — это
      # официальная раздача SDK самим правообладателем, а не хранение копии:
      # между прогонами нигде ничего не остаётся, что и требует лицензия
      # (пункт 2, запрет выкладывать библиотеку «саму по себе»).
      #
      # Голый curl на этот URL отдаёт HTML-заглушку с редиректом вместо архива —
      # это не защита от ботов, а обычная nginx-настройка против прямого
      # скрапинга поисковиками; браузерный Referer её снимает (см. -e ниже).
      #
      # Версия зафиксирована в самом URL, а sha256 — отдельно: если Madrigal
      # обновит контент по тому же имени файла, шаг явно упадёт на сверке
      # суммы, а не подсунет молча другую версию библиотеки.
      #
      # Двигать версию приходится не по желанию: старые пакеты с byprod.io
      # ПРОПАДАЮТ — 0.5.2 отдал 404 в тот же день, когда вышла 0.5.3, и сборка
      # встала. Поэтому «закрепились и забыли» тут не работает: обновление
      # версии это реакция на 404, а не плановая работа, и сверять новую пару
      # (рантайм + биндинг) надо прогоном dev/byprod_check.tscn.
      #
      # Шаг обязателен: byprod.gdextension объявляет библиотеку зависимостью, а
      # Godot обрывает экспорт, если объявленной зависимости нет на диске.
      - name: Скачать рантайм byProd
        shell: bash
        env:
          BYPROD_SDK_URL: https://byprod.io/packages/byProdSDK0.5.3.zip
          BYPROD_SDK_SHA256: 0d7225913b2892bdfaea936f3a39aa57c418b416d3c30a6e18856477914bcd6c
        run: |
          set -euo pipefail
          curl -fsSL "$BYPROD_SDK_URL" -e "https://byprod.io/" -o /tmp/byprod-sdk.zip
          echo "${BYPROD_SDK_SHA256}  /tmp/byprod-sdk.zip" | sha256sum -c -
          unzip -jo /tmp/byprod-sdk.zip "*/bin/byProd.dll" "*/bin/libbyProd.so" -d addons/byprod/bin/
          rm /tmp/byprod-sdk.zip
          ls -l addons/byprod/bin/

      - name: Определить номер и метку сборки
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.number }}
          # По PR собирается временный merge-коммит с master, но его хэша нет ни
          # в одной ветке, и со следующим пушем он пропадает. Номер берётся от
          # головного коммита PR — того, что автор видит у себя в ветке.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/build_version.sh "${PR_HEAD_SHA:-HEAD}")"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            label="pr${PR_NUMBER}"
          else
            label="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          echo "Номер сборки: ${version}, метка архива: ${label}"

      # Обе платформы на одном раннере: движок, шаблоны и импорт ресурсов
      # переиспользуются, второй вызов доходит до экспорта за секунды.
      - name: Собрать Windows
        uses: ./.github/actions/godot-export
        with:
          platform: windows
          label: ${{ steps.label.outputs.label }}
          version: ${{ steps.label.outputs.version }}

      - name: Собрать Linux
        uses: ./.github/actions/godot-export
        with:
          platform: linux
          label: ${{ steps.label.outputs.label }}
          version: ${{ steps.label.outputs.version }}

      - name: Выложить артефакты
        uses: actions/upload-artifact@v7
        with:
          name: astral-genesis-${{ steps.label.outputs.label }}
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error
