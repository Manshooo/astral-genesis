name: Релиз

# Релиз — кнопка: Actions → Релиз → Run workflow. Пустое поле версии значит
# «то, что разрабатывается», то есть config/version из project.godot в master;
# номер руками — для случая, когда выпускать надо под другим (его бамп бот
# закоммитит сам). Дальше без участия человека: тег vX.Y.Z на коммит с этим
# номером, сборка обеих платформ, релиз с архивами.
#
# Мёрж PR релиз не выпускает: все PR идут прямо в master, и мёрж — обычная
# работа, а не решение выпустить версию (docs/astral-genesis/Задачи/Карточки/
# Работа в master и релизы тегами.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без префикса v, например 0.7.0. Пусто — из project.godot в master"
        required: false
        type: string

permissions:
  contents: write
  # actions:write — иначе actions/cache внутри godot-export не может СОХРАНИТЬ
  # кэш (падает не сборка, а только post-джоб warning «token has no writable
  # scopes»). Объявление любого permissions: сбрасывает НЕперечисленные scope
  # в none, а не наследует умолчания репозитория — contents: write сам по себе
  # не подразумевает actions: write.
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Версия и бамп
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Клонировать master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          # LFS и сабмодули этому джобу не нужны: он правит только текстовые файлы.

      - name: Определить версию
        id: version
        env:
          # Поле ввода — текст извне, поэтому идёт через переменную окружения,
          # а не подставляется в текст скрипта.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          source="поле ввода"
          if [ -z "$version" ]; then
            version="$(sed -n -E 's/^config\/version="(.*)"$/\1/p' project.godot | head -n 1)"
            source="config/version в project.godot"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${source}: «${version}» — не версия вида X.Y.Z"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Тег v${version} уже существует — релиз этой версии уже выпускался. Следующую версию поднимает bash .github/scripts/set_version.sh X.Y.Z"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Версия релиза: ${version} (${source})"

      - name: Проставить версию и закоммитить
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/set_version.sh "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Обычно номер уже в master: его поднимают в начале цикла версии, и
          # тег встаёт на последний коммит как есть. Коммит бампа — только когда
          # выпускают под номером, отличным от project.godot.
          if git diff --quiet; then
            echo "Версия в файлах уже ${VERSION} — коммит не нужен"
          else
            git commit -am "chore: версия ${VERSION} [skip ci]"
            git push origin master
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Сборка и публикация
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Клонировать коммит с бампом
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      # То же, что в build.yml: рантайм скачивается прямо с byprod.io (не
      # хранится копией нигде между прогонами — так требует лицензия), а
      # byprod.gdextension объявляет его зависимостью — без файла Godot обрывает
      # экспорт. Здесь шаг тем более обязателен: это ТА САМАЯ сборка, которая
      # уезжает игрокам, и она обязана быть со звуком.
      - name: Скачать рантайм byProd
        shell: bash
        env:
          BYPROD_SDK_URL: https://byprod.io/packages/byProdSDK0.5.3.zip
          BYPROD_SDK_SHA256: 0d7225913b2892bdfaea936f3a39aa57c418b416d3c30a6e18856477914bcd6c
        run: |
          set -euo pipefail
          curl -fsSL "$BYPROD_SDK_URL" -e "https://byprod.io/" -o /tmp/byprod-sdk.zip
          echo "${BYPROD_SDK_SHA256}  /tmp/byprod-sdk.zip" | sha256sum -c -
          unzip -jo /tmp/byprod-sdk.zip "*/bin/byProd.dll" "*/bin/libbyProd.so" -d addons/byprod/bin/
          rm /tmp/byprod-sdk.zip
          ls -l addons/byprod/bin/

      - name: Собрать Windows
        uses: ./.github/actions/godot-export
        with:
          platform: windows
          label: v${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

      - name: Собрать Linux
        uses: ./.github/actions/godot-export
        with:
          platform: linux
          label: v${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

      - name: Повесить тег
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Astral Genesis v${VERSION}"
          git push origin "v${VERSION}"

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Пока мажорная версия нулевая, игра остаётся альфой — помечаем релиз
          # как предварительный, чтобы «Latest release» не обещал готовую игру.
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac

          gh release create "v${VERSION}" dist/*.zip \
            --title "Astral Genesis v${VERSION}" \
            --generate-notes \
            $prerelease
