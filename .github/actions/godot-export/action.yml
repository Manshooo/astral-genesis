name: Экспорт Godot
description: >-
  Ставит Godot с шаблонами экспорта и собирает сборку под ту платформу,
  на раннере которой запущен. Кладёт готовый .zip в dist/.

# Версия движка — не вход этого action: её умолчание живёт в godot-setup, и
# держать второе здесь значило бы, что обновление Godot правится в двух местах.
inputs:
  platform:
    description: "windows или linux — определяет, какой пресет экспортировать."
    required: true
  label:
    description: "Что подставить в имя архива после названия игры: v0.7.0, v0.7.0-dev.33+fc91d3c, pr42."
    required: true
  version:
    description: "Номер в config/version на время сборки: X.Y.Z у релиза, X.Y.Z-dev.N+HASH у остальных (build_version.sh)."
    required: true

outputs:
  archive:
    description: Путь к собранному архиву относительно корня репозитория.
    value: ${{ steps.export.outputs.archive }}

runs:
  using: composite
  steps:
    # Установка, кэш и импорт — общий шаг с headless-проверками (godot-setup),
    # здесь только то, что нужно одной сборке.
    - name: Движок и импорт
      id: setup
      uses: ./.github/actions/godot-setup
      with:
        templates: "true"

    # После импорта, а не до: ключ кэша .godot считается от project.godot, и
    # номер с хэшем коммита промахивался бы мимо кэша даже на правке доков.
    # Коммитить нечего — правка живёт только на раннере.
    - name: Проставить номер сборки
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: bash .github/scripts/set_version.sh "$VERSION"

    - name: Экспорт
      id: export
      shell: bash
      env:
        GODOT: ${{ steps.setup.outputs.bin }}
        PLATFORM: ${{ inputs.platform }}
        LABEL: ${{ inputs.label }}
      run: |
        set -euo pipefail

        # $GITHUB_WORKSPACE на Windows приходит с обратными слешами, а нам нужен
        # абсолютный путь, переживающий cd внутри bash.
        root="$PWD"

        case "$PLATFORM" in
          windows) preset="Windows Desktop"; binary="AstralGenesis.exe" ;;
          linux)   preset="Linux";           binary="AstralGenesis.x86_64" ;;
          *) echo "::error::Неизвестная платформа '${PLATFORM}'"; exit 1 ;;
        esac

        mkdir -p "build/${PLATFORM}" dist
        "$GODOT" --headless --export-release "$preset" "${root}/build/${PLATFORM}/${binary}"

        # Godot умеет завершиться с нулевым кодом, ничего не записав (например,
        # если пресет не нашёлся) — проверяем результат явно.
        if [ ! -s "build/${PLATFORM}/${binary}" ]; then
          echo "::error::Экспорт не создал ${binary}"
          exit 1
        fi

        archive="dist/astral-genesis-${LABEL}-${PLATFORM}-x86_64.zip"
        cd "build/${PLATFORM}"
        if [ "$RUNNER_OS" = "Windows" ]; then
          7z a -tzip -bso0 "${root}/${archive}" ./*
        else
          chmod +x "$binary"
          zip -qr "${root}/${archive}" .
        fi
        cd "$root"

        echo "archive=${archive}" >> "$GITHUB_OUTPUT"
        ls -lh "$archive"
