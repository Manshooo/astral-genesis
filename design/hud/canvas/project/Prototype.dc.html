<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1497,"height":980}}'>
var CX = 748.5, CY = 360, START = 130, SWEEP = 280;
var INIT = { t: 0, soul: 0.7, body: 1, hp: 1, embodied: false, legless: false, drain: true, turmoil: 0.6,
  lang: 'ru', keyStyle: 'letter', target: 'none', shownTarget: 'door', msgT: -99, msgI: 0, msgShow: 0,
  hitT: -99, ctrlT: -99, saveT: -99, possT: -99, possCol: '201,168,242', lastNotable: -99,
  arcA: 0, hov: 0, sn: 0, promptA: 0 };
var STR = {
  ru: { pass: 'Пройти', tree: 'Древо навыков', move: 'Ход', flight: 'Полёт', jump: 'Прыжок', sprint: 'Бег', lmb: 'ЛКМ',
    msgs: ['Заперто…', 'Прохода нет', 'Заперто. Нужен ключ доступа к уровню'] },
  en: { pass: 'Go through', tree: 'Skill tree', move: 'Move', flight: 'Flight', jump: 'Jump', sprint: 'Sprint', lmb: 'LMB',
    msgs: ['Locked…', 'No way through', 'Locked. Requires a level access key'] }
};
var TARGETS = ['none', 'door', 'incubator', 'body'];
var TARGET_NAMES = { none: 'ничего', door: 'дверь', incubator: 'инкубатор', body: 'тело' };
var BTN = 'min-height:44px;padding:0 14px;border-radius:3px;border:1px solid rgba(201,168,242,.38);background:rgba(201,168,242,.06);color:#ECE8F2;font-family:inherit;font-size:13px;cursor:pointer;text-align:left';
var BTN_ON = 'min-height:44px;padding:0 14px;border-radius:3px;border:1px solid #C9A8F2;background:rgba(201,168,242,.2);color:#FFFFFF;font-family:inherit;font-size:13px;cursor:pointer;text-align:left';
var BTN_OFF = 'min-height:44px;padding:0 14px;border-radius:3px;border:1px solid #3a3440;background:transparent;color:#7d7686;font-family:inherit;font-size:13px;cursor:not-allowed;text-align:left';

function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function nz(a, s) { return Math.sin(3 * a + s) * 0.5 + Math.sin(7 * a + 1.7 + s * 1.3) * 0.3 + Math.sin(13 * a + 0.4 + s * 0.7) * 0.2; }
function sstep(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

function mt(v, to, step) { return v < to ? Math.min(to, v + step) : Math.max(to, v - step); }
function arcPts(r, frac, amp, seed) {
  if (frac <= 0.002) return [];
  var n = Math.max(2, Math.floor(SWEEP * frac / 3) + 1), pts = [];
  for (var i = 0; i <= n; i++) {
    var a = (START + SWEEP * frac * i / n) * Math.PI / 180;
    var rr = r + amp * nz(a, seed);
    pts.push([CX + rr * Math.cos(a), CY + rr * Math.sin(a)]);
  }
  return pts;
}
function toD(pts) {
  if (!pts.length) return 'M0 0';
  return 'M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L');
}

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.setState(INIT);
    var last = performance.now();
    var loop = function (now) {
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      self.step(dt);
      self.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  step(dt) {
    var s = Object.assign({}, INIT, this.state);
    var n = { t: s.t + dt };
    var soul = s.soul, body = s.body, emb = s.embodied;
    if (s.drain) {
      if (emb) {
        body = Math.max(0, body - dt / 60);
        if (body <= 0) {
          emb = false;
          n.ctrlT = n.t; n.saveT = n.t; n.lastNotable = n.t; n.possT = n.t; n.possCol = '201,168,242';
        }
      } else {
        soul = Math.max(0, soul - dt / 60 * (soul > 1 ? 2 : 1));
      }
    }
    n.soul = soul; n.body = body; n.embodied = emb;
    var active = emb ? body : Math.min(soul, 1);
    var over = !emb && soul > 1.001;
    var lastN = n.lastNotable != null ? n.lastNotable : s.lastNotable;
    var recent = n.t - lastN < 1.4;
    var tgt = active < 0.15 ? 1 : active < 0.35 ? 0.75 : (recent || over) ? 0.9 : 0;
    var tau = tgt > s.arcA ? 0.12 : 0.5;
    n.arcA = s.arcA + (tgt - s.arcA) * (1 - Math.exp(-dt / tau));
    var hovT = (s.target === 'door' || s.target === 'incubator') ? 1 : 0;
    var snT = s.target === 'body' ? 1 : 0;
    n.hov = mt(s.hov, hovT, 10 * dt);
    n.sn = mt(s.sn, snT, 10 * dt);
    var ptau = hovT > s.promptA ? 0.1 : 0.15;
    n.promptA = s.promptA + (hovT - s.promptA) * (1 - Math.exp(-dt / ptau));
    this.setState(n);
  }

  renderVals() {
    var self = this;
    var s = Object.assign({}, INIT, this.state);
    var t = s.t, L = STR[s.lang], T = s.turmoil, emb = s.embodied;
    var set = function (o) { self.setState(o); };

    // --- Распад того кармана, что убывает: душа вне тела, тело во плоти ---
    // Кривая одна; у тела нет базы и тон тёплый (в сепию), у души — холодный (в серое).
    var f = Math.min(s.soul, 1);
    var d = decayD(emb ? s.body : f);
    var base = emb ? 0 : 1;
    var P = 1.2 - 0.65 * d;
    var beat = Math.pow(Math.max(0, Math.sin(2 * Math.PI * t / P)), 6);
    var vig = clamp((0.12 * base + 0.6 * d) * (1 + (d > 0.35 ? 0.35 * beat : 0)), 0, 1);
    var desat = 0.15 * base + 0.7 * d;
    var disp = 8 * d * d;
    var ca = 2.5 * d * d;
    var tint = emb ? [1, 0.85, 0.62] : [1, 1, 1], lw = [0.299, 0.587, 0.114], rows = [];
    for (var ri = 0; ri < 3; ri++) {
      var row = [];
      for (var cj = 0; cj < 3; cj++) row.push(((1 - desat) * (ri === cj ? 1 : 0) + desat * tint[ri] * lw[cj]).toFixed(4));
      rows.push(row.join(' ') + ' 0 0');
    }
    rows.push('0 0 0 1 0');

    // --- Тело: только во плоти ---
    var ht = t - s.hitT, hitK = ht >= 0 && ht < 3 ? 1 : 0, h = s.hp;
    var hitDark = emb ? 0.55 * Math.exp(-ht / 0.35) * hitK : 0;
    var hitRed = emb ? 0.5 * Math.exp(-ht / 0.5) * hitK : 0;
    // Здоровье тела — только кровь по краю; потемнение и тряска — лишь импульс удара.
    var edge = clamp(hitDark, 0, 1);
    var bloodA = emb ? clamp(0.7 * sstep(0.45, 0.1, h) + hitRed, 0, 1) : 0;
    var shakeAmp = emb ? 5 * Math.exp(-ht / 0.18) * hitK : 0;
    var sx = shakeAmp * nz(t * 37, 1), sy = shakeAmp * nz(t * 41, 2.3);
    var pt = t - s.possT, poss = pt >= 0 && pt < 2 ? 0.7 * Math.exp(-pt / 0.3) : 0;

    // --- Дуга ---
    var active = emb ? s.body : f;
    var col = emb ? '#F0BE62' : '#C9A8F2';
    var amp = 0.4 + 1.8 * T, seed = t * 0.6, r = 22 + 0.6 * Math.sin(t * 2.1);
    var beatA = emb ? Math.pow(Math.max(0, Math.sin(2 * Math.PI * t / 0.8)), 4) : beat;
    var danger = active < 0.15;
    var mainPts = arcPts(r, active, amp, seed);
    var tip = mainPts.length ? mainPts[mainPts.length - 1] : [-10, -10];
    var over = !emb && s.soul > 1.001, ex = over ? Math.min(s.soul - 1, 1) : 0;
    var lk = {};
    for (var i = 0; i < 5; i++) {
      var ph = (t * 0.55 + i / 5) % 1, k = (i * 0.37 + 0.11) % 1;
      var a = (START + SWEEP * ex * k) * Math.PI / 180, rr = r + 7 + 14 * ph;
      lk['lk' + i + 'x'] = (CX + rr * Math.cos(a)).toFixed(1);
      lk['lk' + i + 'y'] = (CY + rr * Math.sin(a)).toFixed(1);
      lk['lk' + i + 'a'] = over ? ((1 - ph) * 0.8).toFixed(2) : '0';
    }

    // --- Прицел ---
    var j = (0.5 + T) * (1 + 0.3 * nz(t * 5, 1)), len = 7 * s.sn, rays = [];
    [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(function (dd) {
      var px = -dd[1], py = dd[0];
      var p0 = [CX + dd[0] * 3, CY + dd[1] * 3];
      var p1 = [CX + dd[0] * (3 + len * 0.5) + px * 0.6 * j, CY + dd[1] * (3 + len * 0.5) + py * 0.6 * j];
      var p2 = [CX + dd[0] * (3 + len) - px * 0.3 * j, CY + dd[1] * (3 + len) - py * 0.3 * j];
      rays.push('M' + p0.join(' ') + ' L' + p1.join(' ') + ' L' + p2.join(' '));
    });

    // --- Подсказка ---
    var tg = (s.target === 'door' || s.target === 'incubator') ? s.target : s.shownTarget;
    var label = tg === 'incubator' ? L.tree : L.pass;
    var keyIsIcon = s.keyStyle === 'icon';
    var keyText = s.keyStyle === 'letter' ? 'F' : L.lmb;
    var pa = s.promptA;
    var echoX = 1 + 2 * T + 1.2 * T * nz(t * 9, 0.3), echoY = 0.6 * T * nz(t * 7, 1.9);

    // --- Сообщение ---
    var me = t - s.msgT, msgOn = me >= 0 && me < 2.9;
    var ma = me < 0.3 ? me / 0.3 : me < 2.0 ? 1 : Math.max(0, 1 - (me - 2) / 0.9);
    var mb = me < 0.3 ? 4 * (1 - me / 0.3) : me > 2 ? 5 * (me - 2) / 0.9 : 0;
    var ml = me > 2 ? 0.14 * (me - 2) / 0.9 : 0;
    var my = me < 0.3 ? 3 * (1 - me / 0.3) : me > 2 ? -6 * (me - 2) / 0.9 : 0;

    // --- Управление ---
    var lines = emb ? [[null, L.move]].concat(s.legless ? [] : [['Space', L.jump], ['Shift', L.sprint]]) : [[null, L.flight]];
    var ctrl = lines.map(function (ln, i) {
      var e = t - s.ctrlT - i * 0.09;
      var al = e < 0 ? 0 : e < 0.35 ? e / 0.35 : e < 4 ? 1 : e < 5 ? 1 - (e - 4) : 0;
      var tx = e < 0.35 ? -6 * (1 - clamp(e / 0.35, 0, 1)) : 0;
      return {
        hasKey: !!ln[0], key: ln[0] || '', label: ln[1],
        plain: (ln[0] ? '[' + ln[0] + '] ' : '') + ln[1],
        style: 'position:relative;white-space:nowrap;opacity:' + al.toFixed(3) + ';transform:translateX(' + tx.toFixed(1) + 'px)',
        echoStyle: 'position:absolute;left:' + (1 + 2 * T + 1.2 * T * nz(t * 8 + i, 0.7)).toFixed(2) + 'px;top:0;color:rgba(201,168,242,.26)'
      };
    });

    // --- Сохранение ---
    var se = t - s.saveT, saveOn = se >= 0 && se < 1.55;
    var saveA = !saveOn ? 0 : se < 1.15 ? 0.75 : 0.75 * (1 - (se - 1.15) / 0.4);

    var vals = {
      seed: Math.floor(t * 6) % 50, disp: disp.toFixed(2), cm: rows.join('  '), vigCol: emb ? '28,17,6' : '18,10,30', ca: ca.toFixed(2),
      shakeT: 'translate(' + sx.toFixed(2) + ' ' + sy.toFixed(2) + ')',
      incA: s.target === 'incubator' ? 1 : 0,
      walkA: s.target === 'body' ? 1 : 0,
      vig: vig.toFixed(3), bloodA: bloodA.toFixed(3), hitRed: (hitRed * 0.5).toFixed(3), edge: edge.toFixed(3),
      poss: poss.toFixed(3), possCol: s.possCol,
      arcAlpha: (s.arcA * (danger ? 0.6 + 0.4 * beatA : 1)).toFixed(3),
      trackD: toD(arcPts(r, 1, 0.2, 1)), echoD: toD(arcPts(r + 1.3, active, amp * 1.5, seed * 1.4 + 3.2)),
      arcD: toD(mainPts), arcCol: col, arcW: (danger ? 2 + 0.8 * beatA : 2).toFixed(2),
      tipX: tip[0].toFixed(1), tipY: tip[1].toFixed(1), tipCol: over ? '#F1E8FF' : col,
      overD: toD(arcPts(r + 7, ex, amp * 0.8, seed + 5.1)), overEchoD: toD(arcPts(r + 8.5, ex, amp * 1.6, seed * 1.3 + 6.3)),
      dotR: (2 + 2.2 * s.hov).toFixed(2), dotA: ((0.85 + 0.07 * s.hov) * (1 - s.sn)).toFixed(3),
      haloR: (6 + 4 * s.hov).toFixed(2), haloA: (0.1 * s.hov * (1 - s.sn)).toFixed(3),
      crossD: s.sn > 0.01 ? rays.join(' ') : 'M0 0', crossA: (0.95 * s.sn).toFixed(3), crossHaloA: (0.08 * s.sn).toFixed(3),
      promptWrap: 'position:absolute;left:0;top:404px;width:1497px;display:flex;justify-content:center;opacity:' + pa.toFixed(3) +
        ';transform:translateY(' + ((1 - pa) * 4).toFixed(2) + 'px);filter:blur(' + ((1 - pa) * 3).toFixed(2) + 'px)',
      echoStyle: 'position:absolute;left:' + echoX.toFixed(2) + 'px;top:' + echoY.toFixed(2) + 'px;color:rgba(201,168,242,.3);filter:blur(.3px)',
      promptPlain: '[' + (keyIsIcon ? '  ' : keyText) + '] ' + label,
      promptLabel: label, keyText: keyText, keyIsIcon: keyIsIcon, keyIsText: !keyIsIcon,
      msgWrap: 'position:absolute;left:0;top:446px;width:1497px;display:flex;justify-content:center;opacity:' + (msgOn ? ma : 0).toFixed(3) +
        ';transform:translateY(' + my.toFixed(2) + 'px);filter:blur(' + mb.toFixed(2) + 'px);letter-spacing:' + (0.01 + ml).toFixed(3) + 'em',
      msgEcho: 'position:absolute;left:' + echoX.toFixed(2) + 'px;top:0;color:rgba(201,168,242,.28)',
      msgText: L.msgs[s.msgShow],
      ctrl: ctrl,
      saveStyle: 'display:block;opacity:' + saveA.toFixed(3) + ';filter:drop-shadow(0 0 3px rgba(0,0,0,.8))',
      saveDash: (1 - clamp(se / 0.35, 0, 1)).toFixed(3),

      soulVal: Math.round(s.soul * 100), soulShown: Math.round(s.soul * 100) + ' % · ' + Math.round(s.soul * 60) + ' с',
      bodyVal: Math.round(s.body * 100), bodyShown: Math.round(s.body * 100) + ' % · ' + Math.round(s.body * 60) + ' с',
      hpVal: Math.round(s.hp * 100), hpShown: Math.round(s.hp * 100) + ' %',
      turmoilVal: Math.round(T * 100), turmoilShown: Math.round(T * 100) + ' %',
      embodied: emb, legless: s.legless, drain: s.drain,
      hitDisabled: !emb, hitStyle: emb ? BTN : BTN_OFF,
      targetName: TARGET_NAMES[s.target], possessLabel: emb ? 'Выйти из тела' : 'Вселиться',
      readout: (emb ? 'Распад тела' : 'Распад души') + ' · d = ' + d.toFixed(2) + ' · виньетка ' + vig.toFixed(2) +
        ' · обесцвечивание ' + desat.toFixed(2) + (emb ? ' · кровь ' + bloodA.toFixed(2) : ''),
      ruOn: s.lang === 'ru', enOn: s.lang === 'en', ruStyle: s.lang === 'ru' ? BTN_ON : BTN, enStyle: s.lang === 'en' ? BTN_ON : BTN,
      klOn: s.keyStyle === 'letter', kwOn: s.keyStyle === 'word', kiOn: s.keyStyle === 'icon',
      klStyle: s.keyStyle === 'letter' ? BTN_ON : BTN, kwStyle: s.keyStyle === 'word' ? BTN_ON : BTN, kiStyle: s.keyStyle === 'icon' ? BTN_ON : BTN,

      onSoul: function (e) { set({ soul: e.target.value / 100, lastNotable: s.t }); },
      onBody: function (e) { set({ body: e.target.value / 100, lastNotable: s.t }); },
      onHp: function (e) { set({ hp: e.target.value / 100 }); },
      onTurmoil: function (e) { set({ turmoil: e.target.value / 100 }); },
      onEmbodied: function () { set({ embodied: !s.embodied, lastNotable: s.t }); },
      onLegless: function () { set({ legless: !s.legless, ctrlT: s.embodied ? s.t : s.ctrlT }); },
      onDrain: function () { set({ drain: !s.drain }); },
      hit: function () { if (s.embodied) set({ hitT: s.t, hp: Math.max(0.02, s.hp - 0.15) }); },
      cycleTarget: function () {
        var next = TARGETS[(TARGETS.indexOf(s.target) + 1) % TARGETS.length];
        set({ target: next, shownTarget: (next === 'door' || next === 'incubator') ? next : s.shownTarget });
      },
      showMsg: function () { set({ msgT: s.t, msgShow: s.msgI, msgI: (s.msgI + 1) % 3 }); },
      possess: function () {
        if (!s.embodied) {
          set({ embodied: true, body: 1, ctrlT: s.t, saveT: s.t, lastNotable: s.t, possT: s.t, possCol: '240,190,98', target: 'none' });
        } else {
          set({ embodied: false, soul: Math.min(1.6, s.soul + s.body), ctrlT: s.t, saveT: s.t, lastNotable: s.t, possT: s.t, possCol: '201,168,242' });
        }
      },
      setRu: function () { set({ lang: 'ru' }); }, setEn: function () { set({ lang: 'en' }); },
      keyLetter: function () { set({ keyStyle: 'letter' }); }, keyWord: function () { set({ keyStyle: 'word' }); },
      keyIcon: function () { set({ keyStyle: 'icon' }); }
    };
    return Object.assign(vals, lk);
  }
}
</script>
